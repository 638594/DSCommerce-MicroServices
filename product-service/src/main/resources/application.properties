spring.application.name=product-service

# Cada microsserviço roda numa porta diferente.
# product-service = 8081 (o próximo, order-service, vai ser 8082)
server.port=8081

# Banco próprio deste serviço: um H2 em memória chamado "productdb".
# Ele é recriado toda vez que a aplicação sobe, com os dados do import.sql.
# ALTERADO na etapa 7a: banco PostgreSQL próprio deste serviço, rodando no Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5441/productdb}
spring.datasource.username=${DB_USER:productsvc}
spring.datasource.password=${DB_PASSWORD:productsvc}

# Tela do banco no navegador: http://localhost:8081/h2-console
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# NOVO na etapa 4b: onde buscar a chave PÚBLICA para conferir os tokens.
# O Spring busca na primeira requisição com token e guarda em cache.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8084/.well-known/jwks.json}
# Além da assinatura, confere QUEM emitiu o token (o campo "iss")
spring.security.oauth2.resourceserver.jwt.issuer-uri=user-service