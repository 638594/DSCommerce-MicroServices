spring.application.name=gateway

# A ÚNICA porta que o cliente precisa conhecer
server.port=8080

# Para onde o gateway repassa cada grupo de rotas.
# Na etapa do Docker, só estes valores mudam (ex.: http://product-service:8081).
services.user.url=${USER_SERVICE_URL:http://localhost:8084}
services.product.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
services.order.url=${ORDER_SERVICE_URL:http://localhost:8082}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8083}

# Endereços de front-end que podem chamar a API pelo navegador, separados por vírgula
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}


