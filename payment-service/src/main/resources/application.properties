spring.application.name=payment-service

# product-service = 8081, order-service = 8082, payment-service = 8083
server.port=8083

# Banco próprio do payment-service
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.username=sa
spring.datasource.password=

# Tela do banco: http://localhost:8083/h2-console (JDBC URL: jdbc:h2:mem:paymentdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Conexão com o RabbitMQ (mesmo usuário/senha do docker-compose.yml)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:dscommerce}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dscommerce}

# Tempo que o "processamento" do pagamento demora, em segundos.
# Existe só para dar tempo de você ver o pedido em WAITING_PAYMENT antes de virar PAID.
payment.simulated-delay-seconds=10
