spring.application.name=payment-service

# product-service = 8081, order-service = 8082, payment-service = 8083
server.port=8083

# Banco próprio do payment-service
# ALTERADO na etapa 7a: banco PostgreSQL próprio deste serviço, rodando no Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5443/paymentdb}
spring.datasource.username=${DB_USER:paymentsvc}
spring.datasource.password=${DB_PASSWORD:paymentsvc}

# As tabelas são criadas pelo Flyway (src/main/resources/db/migration).
# "validate": o Hibernate só CONFERE se as entidades batem com as tabelas, e não cria nada.
spring.jpa.hibernate.ddl-auto=validate

# Tela do banco: http://localhost:8083/h2-console (JDBC URL: jdbc:h2:mem:paymentdb)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Conexão com o RabbitMQ (mesmo usuário/senha do docker-compose.yml)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:dscommerce}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dscommerce}

# Tempo que o "processamento" do pagamento demora, em segundos.
# Existe só para dar tempo de você ver o pedido em WAITING_PAYMENT antes de virar PAID.
payment.simulated-delay-seconds=10

# NOVO na etapa 6a: onde buscar a chave pública para conferir os tokens
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8084/.well-known/jwks.json}
# Além da assinatura, confere QUEM emitiu o token (o campo "iss")
spring.security.oauth2.resourceserver.jwt.issuer-uri=user-service