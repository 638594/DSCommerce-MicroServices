# Sobe o RabbitMQ com um comando: docker compose up -d
# Painel web: http://localhost:15672  (usuário: dscommerce / senha: dscommerce)
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: dscommerce-rabbitmq
    ports:
      - "5672:5672"     # porta que os serviços Spring usam para mandar/receber mensagens
      - "15672:15672"   # porta do painel web
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dscommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dscommerce}
