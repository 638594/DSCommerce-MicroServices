spring.application.name=order-service

# product-service = 8081, order-service = 8082
server.port=8082

# Banco PRÓPRIO do order-service. Ele não enxerga as tabelas de produto:
# o que ele precisa saber de produto, pergunta para o product-service via HTTP.
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.username=sa
spring.datasource.password=

# Tela do banco: http://localhost:8082/h2-console (JDBC URL: jdbc:h2:mem:orderdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Endereço do product-service. Fica aqui, e não no código,
# porque muda de ambiente para ambiente (local, Docker, nuvem).
product-service.url=http://localhost:8081

# NOVO na etapa 3: conexão com o RabbitMQ (mesmo usuário/senha do docker-compose.yml)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=dscommerce
spring.rabbitmq.password=dscommerce
