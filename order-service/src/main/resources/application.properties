spring.application.name=order-service

# product-service = 8081, order-service = 8082
server.port=8082

# Banco PRÓPRIO do order-service. Ele não enxerga as tabelas de produto:
# o que ele precisa saber de produto, pergunta para o product-service via HTTP.
# banco PostgreSQL próprio deste serviço, rodando no Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5442/orderdb}
spring.datasource.username=${DB_USER:ordersvc}
spring.datasource.password=${DB_PASSWORD:ordersvc}

# As tabelas são criadas pelo Flyway (src/main/resources/db/migration).
# "validate": o Hibernate só CONFERE se as entidades batem com as tabelas, e não cria nada.
spring.jpa.hibernate.ddl-auto=validate

# Tela do banco: http://localhost:8082/h2-console (JDBC URL: jdbc:h2:mem:orderdb)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console



spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Endereço do product-service. Fica aqui, e não no código,
# porque muda de ambiente para ambiente (local, Docker, nuvem).
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}

# NOVO na etapa 3: conexão com o RabbitMQ (mesmo usuário/senha do docker-compose.yml)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:dscommerce}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dscommerce}


# NOVO na etapa 4b: onde buscar a chave PÚBLICA para conferir os tokens.
# O Spring busca na primeira requisição com token e guarda em cache.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8084/.well-known/jwks.json}
# Além da assinatura, confere QUEM emitiu o token (o campo "iss")
spring.security.oauth2.resourceserver.jwt.issuer-uri=user-service

