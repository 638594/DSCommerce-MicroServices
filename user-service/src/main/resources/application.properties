spring.application.name=user-service

# product = 8081, order = 8082, payment = 8083, user = 8084
server.port=8084

# ALTERADO na etapa 7a: banco PostgreSQL próprio deste serviço, rodando no Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5444/userdb}
spring.datasource.username=${DB_USER:usersvc}
spring.datasource.password=${DB_PASSWORD:usersvc}

# As tabelas são criadas pelo Flyway (src/main/resources/db/migration).
# "validate": o Hibernate só CONFERE se as entidades batem com as tabelas, e não cria nada.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Quanto tempo o token vale, em segundos (3600 = 1 hora)
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
